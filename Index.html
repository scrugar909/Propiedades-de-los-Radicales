<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Propiedades de los radicales</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--bd:#d9dfea;--tx:#1b2230;--mu:#667085;--ac:#4f46e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);padding:calc(.5rem + env(safe-area-inset-top,0px)) .7rem .6rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1{margin:0 0 .5rem;font-size:clamp(1.5rem,5.5vw,2.2rem);line-height:1.15}
#nav{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;max-width:900px}
@media(min-width:700px){#nav{grid-template-columns:repeat(14,1fr)}}
#nav button{font:inherit;font-size:1rem;font-family:Georgia,serif;font-style:italic;padding:.5rem .1rem;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
#nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#nav button.w{grid-column:span 2;font-style:normal;font-family:inherit}
sup{font-size:.65em;line-height:0}
main{max-width:900px;margin:0 auto;padding:1rem .8rem 2rem}
h2{margin:.2rem 0;font-size:1.25rem}
#vs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}#vs:empty{display:none}
#vs button{font:inherit;padding:.4rem .9rem;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
#vs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
canvas{width:100%;height:auto;background:#fff;border:1px solid var(--bd);border-radius:14px;display:block}
.ctl{display:flex;align-items:center;gap:.6rem;margin:.8rem 0 .2rem}
.ctl button{font:inherit;border:0;border-radius:10px;padding:.55rem .9rem;background:var(--ac);color:#fff;cursor:pointer}
.ctl button.g{background:var(--card);border:1px solid var(--bd);color:var(--tx)}
#sl{flex:1;height:2rem;accent-color:var(--ac)}
.hint{color:var(--mu);font-size:.85rem}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:.8rem 1rem;margin-top:.7rem}
.box b{display:block;color:var(--mu);font-size:.85rem;margin-bottom:.2rem}
#ex{font:1.3rem Georgia,serif}
#ex .fr{font-size:.95em}
.prop{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4rem .8rem;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:.7rem .8rem;margin-bottom:.8rem;font:clamp(1.3rem,5vw,2.1rem) Georgia,"Cambria Math",serif}
.pc{padding:.3rem .8rem .5rem;border-radius:10px;text-align:center}
.pc small{display:block;font:600 .7rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.1rem}
.pc.st{background:#eef2ff}.pc.st small{color:#4338ca}.pc.go{background:#ecfdf5}.pc.go small{color:#047857}
.cd{flex-basis:100%;text-align:center;font:.9rem system-ui,sans-serif;color:var(--mu)}
i{font-style:italic;font-weight:600}.a{color:#2563eb}.b{color:#ea580c}.n{color:#16a34a}.m{color:#9333ea}.p{color:#db2777}.s{color:#dc2626}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-size:.85em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}
.ov{border-top:2px solid currentColor;padding:0 .15em}
.br{flex-basis:100%;height:0}
.spd{display:flex;align-items:center;gap:.4rem;margin:.4rem 0 .5rem;color:var(--mu);font-size:.9rem}
.spd button{font:inherit;padding:.35rem .8rem;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.spd button.on{background:var(--ac);border-color:var(--ac);color:#fff}

.hd{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:stretch;max-width:1000px;margin:0 auto}.hl{min-width:0}
.lg{align-self:stretch;height:100%;width:auto;aspect-ratio:1/1;object-fit:contain;max-width:130px;min-height:64px}
#nav button{position:relative}
@media(max-width:699px){.hd{display:block;position:relative}.lg{position:absolute;top:0;right:0;width:46px;height:46px;min-height:0}h1{padding-right:54px;font-size:1.35rem;margin-bottom:.4rem}#nav button{font-size:.95rem;padding:.4rem .1rem}header{padding-bottom:.5rem}}
@media(hover:hover){#nav button[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:max-content;max-width:230px;background:#1b2230;color:#fff;font:.8rem/1.3 system-ui,sans-serif;font-style:normal;padding:.35rem .55rem;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:none;text-align:left}#nav button.r:hover::after{left:auto;right:0}}
</style></head><body>

const W=700,H=300,cv=document.getElementById('cv'),x=cv.getContext('2d'),dpr=window.devicePixelRatio||1;

const C={a:'#2563eb',b:'#ea580c',n:'#16a34a',m:'#9333ea',s:'#64748b',w:'#1e293b',r:'#dc2626',p:'#db2777'};
const cl=v=>Math.max(0,Math.min(1,v)),E=t=>t<.5?2*t*t:-1+(4-2*t)*t,sg=(p,s,e)=>E(cl((p-s)/(e-s))),L=(a,b,t)=>a+(b-a)*t;
function T(t,px,py,col,sz=40,al=1){x.globalAlpha=al;x.fillStyle=col;x.font=(/^[abnmp]$/.test(t)?'italic ':'')+sz+'px Georgia,serif';x.fillText(t,px,py)}
function PW(bs,e,px,py,cb,ce,al=1){T(bs,px,py,cb,40,al);T(e,px+22,py-18,ce,26,al)}

function fly(t,fx,fy,tx,ty,col,q,sz=40,m=1){if(q<=0)return;T(t,L(fx,tx,q),L(fy,ty,q)-34*Math.sin(Math.PI*q),col,sz,Math.min(1,q*4)*m)}

const SQ=(cx,y,rw,al=1)=>{T('√',cx,y,C.w,64,al);x.globalAlpha=al;x.strokeStyle=C.w;x.lineWidth=3;x.beginPath();x.moveTo(cx+19,y-30);x.lineTo(cx+19+rw,y-30);x.stroke()};

const dB=(px,y,al)=>{x.globalAlpha=al;x.strokeStyle=C.s;x.lineWidth=2.5;x.beginPath();x.moveTo(px+18,y-14);x.lineTo(px+44,y-14);x.stroke()};

function s1(p){const y1=85,y=195,xf=k=>150+k*70,q=sg(p,0,.12);

T('=',430,y,C.s,40,sg(p,.82,.9));fly('a',246,y1,480,y,C.a,sg(p,.86,1))}

const s2f=(M,inv)=>p=>{const y1=80,y2=205,RX=250,PX=230,ax=RX+(M?51.5:46.5);

if(!inv){dR(RX,y1,M);

if(M)fly('m',ax+22,y1-18,PX+30,y2-26,C.m,sg(p,.2,.6),24);else T('1',PX+30,y2-26,C.w,24,sg(p,.55,.75))}
else{dP(PX,y1,M);SQ(RX,y2,M?85:55,sg(p,.15,.4));

fly('a',PX,y1,ax,y2,C.a,sg(p,.4,.8));
if(M)fly('m',PX+30,y1-26,ax+22,y2-18,C.m,sg(p,.5,.85),26)}};

/* Radical alto con fracción dentro (división) */

const K=(k,t)=>`<i class="${k}">${t}</i>`,A=K('a','a'),Bb=K('b','b'),N=K('n','n'),M=K('m','m'),Q=(b,e)=>`${b}<sup>${e}</sup>`,
FR=(u,d)=>`<span class="fr"><span>${u}</span><span>${d}</span></span>`,RD=(i,r)=>`<sup>${i}</sup>√<span class="ov">${r}</span>`;
const prop=f=>`<div class="pc st"><small>Partimos de</small><div>${f[0]}</div></div><div class="eq">${f[3]||'='}</div><div class="pc go"><small>Llegamos a</small><div>${f[1]}</div></div>`+(f[2]?`<div class="cd">${f[2]}</div>`:'');
const R=(f,e,x,d,l,gp)=>({f,e,x,d,l,gp});
const RS=r=>`√<span class="ov">${r}</span>`,PP=K('p','p');
const RP='Radical → potencia',PR='Potencia → radical';
const e1='El exponente 1/n pasa a ser el índice de la raíz y, al revés, el índice n pasa al denominador del exponente.',em='El índice n pasa al denominador del exponente y el exponente m del radicando pasa al numerador.';
const S={
1:{t:'Definición de radical',v:[R([`${RD(N,A)} = ${Bb}`,`${Q(Bb,N)} = ${A}`,'','si'],'La raíz n-ésima de a es el número b que, multiplicado n veces por sí mismo, da a: ⁿ√a = b si bⁿ = a. ⁿ√a se llama radical; a es el radicando, n es el índice y b es la raíz.',`${RD(3,8)} = 2, porque ${Q(2,3)} = 8`,s1)]},
2:{t:'Forma exponencial',v:[
R([RD(N,A),Q(A,FR(1,N))],'El índice n pasa al denominador del exponente. El radicando a no tiene exponente visible, es 1, y ese 1 pasa al numerador.',`${RD(3,8)} = ${Q(8,FR(1,3))} = 2`,s2f(0,0),'Exponente 1/n',RP),
R([RD(N,Q(A,M)),Q(A,FR(M,N))],em,`${RD(3,64)} = ${RD(3,Q(2,6))} = ${Q(2,FR(6,3))} = ${Q(2,2)} = 4`,s2f(1,0),'Exponente m/n',RP),
R([Q(A,FR(1,N)),RD(N,A)],e1,`${Q(8,FR(1,3))} = ${RD(3,8)} = 2`,s2f(0,1),'Exponente 1/n',PR),
R([Q(A,FR(M,N)),RD(N,Q(A,M))],'El denominador n del exponente pasa a ser el índice de la raíz y el numerador m pasa a ser el exponente del radicando.',`${Q(2,FR(6,3))} = ${RD(3,Q(2,6))} = ${RD(3,64)} = 4`,s2f(1,1),'Exponente m/n',PR)]},
3:{t:'Producto y división de radicales',v:[
R([RD(N,`${A} · ${Bb}`),`${RD(N,A)} · ${RD(N,Bb)}`],'La raíz de un producto es el producto de las raíces, si tienen el mismo índice n. El índice n se copia en cada radical: a va al primero y b al segundo.',`${RS('15 · 20')} = ${RS(15)} · ${RS(20)}`,s3f('m',0),'ⁿ√(a·b) → ⁿ√a · ⁿ√b','Multiplicación'),
R([`${RD(N,A)} · ${RD(N,Bb)}`,RD(N,`${A} · ${Bb}`)],'Dos radicales con el mismo índice n se juntan en uno solo: el índice se queda y los radicandos a y b se multiplican bajo la misma raíz.',`${RS(15)} · ${RS(20)} = ${RS('15 · 20')} = ${RS(300)}`,s3f('m',1),'ⁿ√a · ⁿ√b → ⁿ√(a·b)','Multiplicación'),
R([RD(N,FR(A,Bb)),FR(RD(N,A),RD(N,Bb))],'La raíz de un cociente es el cociente de las raíces, si tienen el mismo índice n. El índice n se copia en el numerador y en el denominador: a va arriba y b abajo.',`${RS(FR(15,20))} = ${FR(RS(15),RS(20))}`,s3f('d',0),'ⁿ√(a/b) → ⁿ√a / ⁿ√b','División'),
R([FR(RD(N,A),RD(N,Bb)),RD(N,FR(A,Bb))],'Dos radicales con el mismo índice n, uno dividido entre otro, se juntan en uno solo: el índice se queda y el cociente a/b pasa al radicando.',`${FR(RS(15),RS(20))} = ${RS(FR(15,20))} = ${RS(FR(3,4))}`,s3f('d',1),'ⁿ√a / ⁿ√b → ⁿ√(a/b)','División')]},
4:{t:'Simplificación de radicales',v:[
R([RD(`${N}·${PP}`,Q(A,PP)),RD(N,A)],'El índice n · p y el exponente p del radicando tienen el mismo factor p. Se cancela en los dos sitios y queda la raíz de índice n con radicando a.',`${RD(4,9)} = ${RD(4,Q(3,2))} = ${Q(3,FR(2,4))} = ${Q(3,FR(1,2))} = ${RS(3)}`,s4f(0),'ⁿᵖ√aᵖ → ⁿ√a'),
R([RD(N,A),RD(`${N}·${PP}`,Q(A,PP))],'Se puede multiplicar el índice y el exponente del radicando por un mismo número p: el índice pasa a ser n · p y el radicando a elevado a p. El radical no cambia.',`${RS(3)} = ${Q(3,FR(1,2))} = ${Q(3,FR(2,4))} = ${RD(4,Q(3,2))} = ${RD(4,9)}`,s4f(1),'ⁿ√a → ⁿᵖ√aᵖ')]},
5:{t:'Reducción a índice común',v:[R([`${RD(3,586)} y ${RS(70)}`,`${RD(6,Q(586,2))} y ${RD(6,Q(70,3))}`,'índice común = m.c.m.(3, 2) = 6','→'],'Para comparar u operar radicales de distinto índice se pasan a índice común. Cada radical se escribe como potencia, se buscan fracciones equivalentes con el mismo denominador (el m.c.m. de los índices) y se vuelve a la forma de radical. Con el mismo índice basta comparar los radicandos: 343396 > 343000, luego ∛586 > √70.',`${RD(3,586)} = ${Q(586,FR(1,3))} = ${Q(586,FR(2,6))} = ${RD(6,Q(586,2))} = ${RD(6,343396)}<br>${RS(70)} = ${Q(70,FR(1,2))} = ${Q(70,FR(3,6))} = ${RD(6,Q(70,3))} = ${RD(6,343000)}<br>→ ${RD(3,586)} > ${RS(70)}`,s5)]},
6:{t:'Suma y resta de radicales',v:[
R([`7${RS(5)} + 11${RS(5)} − ${RS(5)}`,`17${RS(5)}`,'solo se suman o restan los coeficientes de radicales semejantes (mismo índice y mismo radicando)','→'],'Solo se pueden sumar o restar radicales semejantes: mismo índice y mismo radicando. Se saca el radical como factor común y se suman o restan los coeficientes. Un radical sin coeficiente escrito tiene coeficiente 1.',`7${RS(5)} + 11${RS(5)} − ${RS(5)} = 17${RS(5)}`,s6a,'Radicales semejantes'),
R([`${RS(32)} + 5${RS(18)} − ${RS(50)}`,`14${RS(2)}`,'primero se factoriza y se sacan factores fuera de la raíz','→'],'Si los radicales no parecen semejantes, se factorizan los radicandos y se sacan factores fuera de la raíz. Cuando quedan radicales semejantes, se suman o restan los coeficientes.',`${RS(32)} + 5${RS(18)} − ${RS(50)} = ${RS(Q(2,5))} + 5${RS(Q(3,2)+' · 2')} − ${RS(Q(5,2)+' · 2')} =<br>= 4${RS(2)} + 15${RS(2)} − 5${RS(2)} = 14${RS(2)}`,s6b,'Tras simplificar')]}};
const SF={t:'Sacar factores fuera de la raíz',v:[
R([RS(18),`3${RS(2)}`,'se factoriza el radicando y salen los factores con exponente mayor o igual que el índice','→'],'Se factoriza el radicando. Un factor cuyo exponente es mayor o igual que el índice sale de la raíz con el exponente dividido entre el índice; lo que sobra se queda dentro.',`${RS(18)} = ${RS(Q(3,2)+' · 2')} = ${RS(Q(3,2))} · ${RS(2)} = 3${RS(2)}`,sF1,'√18'),
R([RS(720),`12${RS(5)}`,'se factoriza el radicando y salen los factores con exponente mayor o igual que el índice','→'],'Se factoriza el radicando. En √(2⁴), el exponente 4 se divide entre el índice 2 y sale 2². En √(3²) sale 3. El 5 no se puede sacar y se queda dentro.',`${RS(720)} = ${RS(Q(2,4)+' · '+Q(3,2)+' · 5')} = ${RS(Q(2,4))} · ${RS(Q(3,2))} · ${RS(5)} = ${Q(2,2)} · 3 · ${RS(5)} = 12${RS(5)}`,sF2,'√720')]};
const SD={t:'Producto y división con distinto índice',v:[
R([`${RS(3)} · ${RD(3,2)}`,RD(6,108),'índice común = m.c.m.(2, 3) = 6','→'],'Para multiplicar radicales de distinto índice se reducen primero a índice común. Después se multiplican los radicandos bajo una sola raíz.',`${RS(3)} · ${RD(3,2)} = ${RD(6,Q(3,3))} · ${RD(6,Q(2,2))} = ${RD(6,Q(3,3)+' · '+Q(2,2))} = ${RD(6,108)}`,sD1,'Producto'),
R([FR(RD(3,16),RD(6,32)),RS(2),'índice común = m.c.m.(3, 6) = 6','→'],'Se reducen a índice común y se dividen los radicandos bajo una sola raíz. Al dividir potencias de la misma base se restan los exponentes. Al final se simplifica el índice y el exponente.',`${FR(RD(3,16),RD(6,32))} = ${FR(RD(6,Q(16,2)),RD(6,32))} = ${RD(6,FR('('+Q(2,4)+')<sup>2</sup>',Q(2,5)))} = ${RD(6,FR(Q(2,8),Q(2,5)))} = ${RD(6,Q(2,3))} = ${RS(2)}`,sD2,'División')]};
const SR={t:'Racionalización del denominador',v:[
R(['radical en el denominador','sin radical en el denominador','racionalización del denominador','→'],'Al proceso por el cual hacemos desaparecer los radicales del denominador se le llama racionalización del denominador.',`${FR(2,RS(3))} → ${FR('2'+RS(3),3)}`,sR0,'¿Qué es?'),
R([FR(2,RS(3)),FR('2'+RS(3),3),'multiplicamos numerador y denominador por √3','→'],'Si el denominador es una raíz cuadrada, se multiplica el numerador y el denominador por esa misma raíz: √3 · √3 = 3.',`${FR(2,RS(3))} = ${FR('2 · '+RS(3),RS(3)+' · '+RS(3))} = ${FR('2'+RS(3),3)}`,sR1,'Caso 1: raíz cuadrada'),
R([FR(1,RD(5,Q(7,2))),FR(RD(5,Q(7,3)),7),'multiplicamos por ⁵√(7³): 5 − 2 = 3','→'],'Si el denominador es otra raíz, se multiplica por la raíz del mismo índice que completa el exponente del radicando hasta el índice: 5 − 2 = 3. Al multiplicar se suman los exponentes y ⁵√(7⁵) = 7.',`${FR(1,RD(5,Q(7,2)))} = ${FR('1 · '+RD(5,Q(7,3)),RD(5,Q(7,2))+' · '+RD(5,Q(7,3)))} = ${FR(RD(5,Q(7,3)),RD(5,Q(7,5)))} = ${FR(RD(5,Q(7,3)),7)}`,sR2,'Caso 2: otras raíces'),
R([FR(1,RS(5)+' − '+RS(3)),FR(RS(5)+' + '+RS(3),2),'multiplicamos por el conjugado del denominador','→'],'Si el denominador es una suma o una resta de raíces, se multiplica numerador y denominador por su conjugado, que es la misma expresión con el signo cambiado. Así se usa (a − b)(a + b) = a² − b².',`${FR(1,RS(5)+' − '+RS(3))} = ${FR('1 · ('+RS(5)+' + '+RS(3)+')','('+RS(5)+' − '+RS(3)+') · ('+RS(5)+' + '+RS(3)+')')} = ${FR(RS(5)+' + '+RS(3),'('+RS(5)+')<sup>2</sup> − ('+RS(3)+')<sup>2</sup>')} = ${FR(RS(5)+' + '+RS(3),2)}`,sR3,'Caso 3: con resta'),
R([FR(2,'3 + '+RS(2)),FR('6 − 2'+RS(2),7),'multiplicamos por el conjugado del denominador','→'],'Con una suma en el denominador se multiplica por el conjugado, con el signo cambiado: (3 + √2)(3 − √2) = 3² − (√2)² = 9 − 2 = 7.',`${FR(2,'3 + '+RS(2))} = ${FR('2 · (3 − '+RS(2)+')','(3 + '+RS(2)+') · (3 − '+RS(2)+')')} = ${FR('6 − 2'+RS(2),'3<sup>2</sup> − ('+RS(2)+')<sup>2</sup>')} = ${FR('6 − 2'+RS(2),'9 − 2')} = ${FR('6 − 2'+RS(2),7)}`,sR4,'Caso 3: con suma')]};
S[1].v[0].l='Definición';
S[1].v.push(R([`${A} ≥ 0`,`${RD(N,A)} existe para cualquier ${N}`,`si ${A} < 0, solo existen sus raíces de índice impar. Y ${RS(4)} = 2: se toma la raíz positiva`,'⇒'],'Si a ≥ 0, la raíz ⁿ√a existe cualquiera que sea el índice n. Si a < 0, solo existen sus raíces de índice impar. Aunque 4 tiene dos raíces cuadradas, cuando escribimos √4 nos referimos a la positiva: √4 = 2.',`${RD(3,'−8')} = −2, pero ${RS('−4')} no existe en los números reales. ${RS(4)} = 2 (no −2)`,sCond,'Condiciones'));
const O={...S};S[3]=SF;S[4]=O[4];S[5]=O[3];S[6]=O[5];S[7]=SD;S[8]=O[6];S[9]=SR;
const B=[['Definición','w','Definición de radical y condiciones de existencia'],['a<sup>m/n</sup>','','Forma exponencial'],['Factores fuera','w','Sacar factores fuera de la raíz'],['<sup>n·p</sup>√a<sup>p</sup>','','Simplificación de radicales'],['<sup>n</sup>√(a·b)','','Producto y división con el mismo índice'],['Índice común','w','Reducción a índice común'],['<sup>n</sup>√a·<sup>m</sup>√b','','Producto y división con distinto índice'],['Suma y resta','w','Suma y resta de radicales'],['Racionalización','w','Racionalización del denominador']];
let sp=.25,cur=1,vi=0,P=0,dir=0,raf=null;const $=s=>document.querySelector(s);
B.forEach(([h,c,tp],i)=>{const e=document.createElement('button');e.innerHTML=h;e.className=(c||'')+(i>=5?' r':'');e.dataset.tip=tp;e.setAttribute('aria-label',tp);e.onclick=()=>go(i+1);$('#nav').append(e)});
function go(k,j=0){cur=k;vi=j;stop();P=0;const V=S[k].v,v=V[j];
document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on',i+1==k));
const gps=[...new Set(V.map(u=>u.gp).filter(Boolean))];let h='';
if(gps.length){const g=V[j].gp,z=V.length/gps.length;h=gps.map((n,i)=>`<button class="${n==g?'on':''}" onclick="go(${k},${i*z+j%z})">${n}</button>`).join('')+'<span class="br"></span>'+V.map((u,i)=>u.gp==g?`<button class="${i==j?'on':''}" onclick="go(${k},${i})">${u.l}</button>`:'').join('')}
else if(V.length>1)h=V.map((u,i)=>`<button class="${i==j?'on':''}" onclick="go(${k},${i})">${u.l}</button>`).join('');
$('#vs').innerHTML=h;
$('#tt').textContent=S[k].t;$('#pr').innerHTML=prop(v.f);$('#em').textContent=v.e;$('#ex').innerHTML=v.x;draw()}
function draw(){x.globalAlpha=1;x.clearRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';S[cur].v[vi].d(P);
$('#sl').value=P*100;$('#pc').textContent=Math.round(P*100)+'%'}
function stop(){dir=0;cancelAnimationFrame(raf);$('#pl').textContent='▶'}
function tick(){P=cl(P+dir*.004*sp);draw();if(P>=1||P<=0)stop();else raf=requestAnimationFrame(tick)}
$('#pl').onclick=()=>{if(dir){stop();return}dir=P>=1?-1:1;$('#pl').textContent='⏸';tick()};
$('#rs').onclick=()=>{stop();P=0;draw()};

document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{sp=+b.dataset.v;document.querySelectorAll('.spd button').forEach(o=>o.classList.toggle('on',o==b))});
go(1);
